name: Release Unsigned Desktop Builds

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v0.1.27 or leave blank for auto)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'universal-apple-darwin'
            arch: 'macOS (Universal - Apple Silicon & Intel)'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch: 'Windows 11 (x64)'

    runs-on: ${{ matrix.platform }}

    env:
      # Instructs the macOS linker/codesign to produce an ad-hoc self-signature during compilation
      APPLE_SIGNING_IDENTITY: '-'
      CI: true
      VITE_BUILD_NUMBER: ${{ github.run_number }}
      VITE_COMMIT_SHA: ${{ github.sha }}
      APP_BUILD_NUMBER: ${{ github.run_number }}
      APP_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js runtime
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm install

      - name: Synchronize Dynamic Semantic Version
        shell: bash
        run: |
          BUILD_NUM="${{ github.run_number }}"
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            TARGET_VER="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.release_tag }}" ] && [[ "${{ inputs.release_tag }}" =~ ^v[0-9] ]]; then
            TARGET_VER="${{ inputs.release_tag }}"
            TARGET_VER="${TARGET_VER#v}"
          else
            TARGET_VER="0.1.${BUILD_NUM}"
          fi
          echo "TARGET_VER=$TARGET_VER" >> $GITHUB_ENV
          echo "VITE_APP_VERSION=$TARGET_VER" >> $GITHUB_ENV
          echo "Synchronizing project build version to: $TARGET_VER"

          # 1. Update package.json
          npm version "$TARGET_VER" --no-git-tag-version --allow-same-version

          # 2. Update src-tauri/tauri.conf.json and src-tauri/Cargo.toml
          node -e "
            const fs = require('fs');
            const confPath = './src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = '$TARGET_VER';
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');

            const cargoPath = './src-tauri/Cargo.toml';
            let cargo = fs.readFileSync(cargoPath, 'utf8');
            cargo = cargo.replace(/^version = \".*\"/m, 'version = \"$TARGET_VER\"');
            fs.writeFileSync(cargoPath, cargo);
          "

      - name: Build Web Application
        run: npm run build

      - name: Sanitize Tauri Signing Key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$RAW_KEY" ]; then
            CLEAN_KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n[:space:]')
            echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
          fi

      - name: Build Tauri Desktop Application (Unsigned / Ad-hoc Signed)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.{0}', github.run_number) }}
          releaseName: 'Spine & Eye Release v${{ env.TARGET_VER || format('0.1.{0}', github.run_number) }}'
          releaseBody: |
            ## Spine & Eye Clinical Ergonomics Desktop Companion
            Always-on cross-platform background reminder app built with Tauri v2.

            ### Clinical Foundations:
            - **Cornell University Ergonomics (CUErgo)**: 20-8-2 work pattern & neutral spine guidelines.
            - **American Academy of Ophthalmology (AAO)**: 20-20-20 rule & digital eye strain blink protocol.

            ### Platform Packages:
            - **macOS**: Ad-hoc signed (`APPLE_SIGNING_IDENTITY: "-"`) `.dmg` and `.app.tar.gz`.
            - **Windows 11**: Standalone NSIS setup (`.exe`) and MSI installer (`.msi`).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
